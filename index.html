<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>《异世界厨师》Otherworld Chef - 手机满屏适配完整版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0d111a;
      overflow: hidden;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Courier New', monospace;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #orientation-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 17, 26, 0.96);
      color: #f4e8c1;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #orientation-overlay h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #ffb84d;
    }
    #orientation-overlay p {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 340px;
    }
    #orientation-overlay button {
      margin-top: 18px;
      padding: 10px 22px;
      background: #ffb84d;
      color: #1e1b18;
      border: 2px solid #fff3d1;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    @media screen and (max-width: 650px) and (orientation: portrait) {
      #orientation-overlay {
        display: flex;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="orientation-overlay">
    <h2>📱 请横屏游玩《异世界厨师》</h2>
    <p>本作专为手机横屏全屏操作设计。请将手机旋转至横屏，进入游戏后点击右上角【⛶ 全屏】可隐藏浏览器地址栏获得最佳大屏视野！</p>
    <button onclick="document.getElementById('orientation-overlay').style.display='none'">我已横屏，继续体验</button>
  </div>
  <div id="game-container"></div>

  <script>
    /**
     * ============================================================================
     * 《异世界厨师》（Otherworld Chef） - 阶段 5：手机超宽屏满屏适配完整版
     * 针对移动端实机反馈专项升级：
     *   1. 动态超宽屏分辨率计算 (自动适配 16:9 ~ 23:9 全面屏手机，消除左右大黑边)
     *   2. 1.25x 近景放大镜头 (Camera Zoom)，让角色、NPC 与互动文字在手机上清晰放大
     *   3. 顶部一键【⛶ 全屏】按钮 (Fullscreen API)，一键收起手机 Chrome 顶部地址栏
     *   4. 放大版人体工学虚拟按键 (贴合屏幕最左下/最右下角，加大 30%)
     *   5. 修复顶部黄色目标栏文字超出边框与右侧按钮重叠的 Bug
     * ============================================================================
     */

    const SAVE_STORAGE_KEY = 'OTHERWORLD_CHEF_SAVE_V5';

    // 根据手机横屏实际长宽比，动态计算最贴合全屏的逻辑宽高（基准高度 420，宽度自适应 800~1040）
    function computeViewportSize() {
      const sw = Math.max(window.innerWidth || 800, window.innerHeight || 450);
      const sh = Math.min(window.innerWidth || 800, window.innerHeight || 450);
      const aspect = Phaser.Math.Clamp(sw / Math.max(1, sh), 1.65, 2.45);
      const baseHeight = 420;
      const dynamicWidth = Math.round(baseHeight * aspect);
      return { width: dynamicWidth, height: baseHeight };
    }

    const VIEWPORT = computeViewportSize();

    // 全屏切换辅助函数（隐藏手机浏览器顶部地址栏）
    function toggleBrowserFullscreen() {
      const docEl = document.documentElement;
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFull) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 0. Web Audio 零依赖复古像素音效合成器 (Retro SFX Synthesizer)
    // ----------------------------------------------------------------------------
    class SoundFX {
      static ctx = null;
      static muted = false;

      static init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      static playTone(freq, type = 'square', duration = 0.1, endFreq = null, gainVal = 0.08) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (endFreq !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
          }
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      }

      static jump() {
        this.playTone(220, 'square', 0.12, 480, 0.06);
      }
      static bounce() {
        this.playTone(260, 'triangle', 0.22, 760, 0.1);
      }
      static pickup() {
        this.playTone(523.25, 'sine', 0.09, 659.25, 0.09);
        setTimeout(() => this.playTone(783.99, 'sine', 0.14, 1046.5, 0.09), 70);
      }
      static bellChime() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.22, f * 1.02, 0.08), idx * 65);
        });
      }
      static fail() {
        this.playTone(240, 'sawtooth', 0.18, 110, 0.07);
      }
      static fanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'square', 0.18, null, 0.08), idx * 95);
        });
      }
      static blip() {
        this.playTone(440, 'sine', 0.04, 520, 0.04);
      }
    }

    // ----------------------------------------------------------------------------
    // 1. 7状态任务枚举、3章食谱定义与全局状态中心
    // ----------------------------------------------------------------------------
    const QUEST_STATES = {
      NOT_STARTED: 'NOT_STARTED',
      ACCEPTED: 'ACCEPTED',
      IN_PROGRESS: 'IN_PROGRESS',
      INGREDIENTS_READY: 'INGREDIENTS_READY',
      DISH_COOKED: 'DISH_COOKED',
      DELIVERED: 'DELIVERED',
      COMPLETED: 'COMPLETED'

      ACCEPTED: '已接受订单',

      INGREDIENTS_READY: '材料齐备(可烹饪)',

      COMPLETED: '已完成'

    const CHAPTER_CONFIGS = {
      1: {

        questId: 'ch1_eileen_berry_meat',
        dishName: '蜜林浆果烤肉',
        dishIcon: '🍖',
        customerName: 'B1 瞭望台·艾琳',
        recipe: { meat: 1, berry: 1, mushroom: 0 },
        recipeText: '鲜嫩兽肉🥩×1 + 晨露浆果🍒×1',
        phases: [
          { minProg: 0,  maxProg: 50,  minHeat: 56, maxHeat: 86, label: '🔥 第1段【武火锁汁(0-50%)】：按住鼓风，保持在右侧高温绿区！', color: '#ffb84d' },
          { minProg: 50, maxProg: 100, minHeat: 24, maxHeat: 54, label: '🍯 第2段【文火裹酱(50-100%)】：适当松手，降到左侧文火绿区！', color: '#8ae0a8' }
        ]
      },
      2: {
        chapter: 2,
        questId: 'ch2_hawk_mushroom_stew',
        dishName: '岩盐黄金菌菇煲',
        dishIcon: '🍲',
        customerName: 'A4 洞穴·老霍克',
        recipe: { meat: 1, berry: 0, mushroom: 1 },
        recipeText: '鲜嫩兽肉🥩×1 + 夜光菌菇🍄×1',
        phases: [
          { minProg: 0,  maxProg: 45,  minHeat: 58, maxHeat: 86, label: '🔥 第1段【猛火爆香(0-45%)】：按住鼓风，高温逼出兽肉焦香！', color: '#ffb84d' },
          { minProg: 45, maxProg: 100, minHeat: 30, maxHeat: 58, label: '🍄 第2段【文火慢炖(45-100%)】：稳住中低温，熬出夜光菌菇高汤！', color: '#8ae0a8' }
        ]
      },
      3: {
        chapter: 3,
        questId: 'ch3_finale_feast',
        dishName: '异界团圆什锦炙烤',
        dishIcon: '🥘',
        customerName: 'A1 餐厅·团圆长桌',
        recipe: { meat: 1, berry: 1, mushroom: 1 },
        recipeText: '兽肉🥩×1 + 浆果🍒×1 + 夜光菇🍄×1',
        phases: [
          { minProg: 0,  maxProg: 35,  minHeat: 62, maxHeat: 88, label: '🔥 第1段【猛火炙烤(0-35%)】：高温锁住呼噜兽肉排的丰沛肉汁！', color: '#ffb84d' },
          { minProg: 35, maxProg: 70,  minHeat: 38, maxHeat: 66, label: '🍄 第2段【中火融香(35-70%)】：让夜光菌菇的鲜味渗入肌理！', color: '#93c5fd' },
          { minProg: 70, maxProg: 100, minHeat: 20, maxHeat: 48, label: '🍒 第3段【文火蜜汁(70-100%)】：低温收汁，裹上晶莹浆果蜜釉！', color: '#8ae0a8' }
        ]
      }
    };

    function createInitialState() {
      return {
        stage: 5,
        chapter: 1,
        gameCleared: false,
        cameraZoom: 1.25, // 默认开启 1.25 倍手机近景放大镜头，让角色与文字清晰放大！
        currentRoom: 'A',
        lastFromRoom: 'START',
        visitedRooms: { A: true, A1: false, A2: false, A3: false, B1: false, A4: false },
        storyFlags: {
          metChef: false,
          metEileen: false,
          metHawk: false,
          shortcutBridgeUnlocked: false,
          caveDoorUnlocked: false,
          mineLiftUnlocked: false,
          eileenInRestaurant: false,
          hawkInRestaurant: false
        },
        quest: {
          id: 'ch1_eileen_berry_meat',
          title: '蜜林浆果烤肉',
          state: QUEST_STATES.NOT_STARTED,
          lastCookedQuality: 'NONE'
        },
        inventory: {
          meat: 0,
          berry: 0,
          mushroom: 0,
          cookedDish: 0,
          dishChapter: 0,
          dishQuality: 'NONE',
          maxCapacity: 8
        },
        currentObjective: '向右进【A1餐厅】找老主厨巴隆',
        respawnCount: 0,
        mushroomBounceCount: 0,
        roomTransitionCount: 0,
        lassoSuccessCount: 0,
        berryPickCount: 0,
        shroomPickCount: 0,
        cookSuccessCount: 0,
        // 手机端默认收起左上角调试面板，避免遮挡画面（可随时点顶部按钮展开）
        debugVisible: false,
        virtualInput: {
          left: false,
          right: false,
          jumpPressed: false,
          jumpJustDown: false,
          interactJustDown: false
        },
        telemetry: {
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          grounded: false,
          coyoteTimer: 0,
          safeX: 110,
          safeY: 380,
          nearTarget: '无'
        }
      };
    }

    const GlobalGameState = createInitialState();

    // ----------------------------------------------------------------------------
    // 1.2 LocalStorage 存档与读档管理器 (SaveSystem)
    // ----------------------------------------------------------------------------
    const SaveSystem = {
      save() {
        try {
          const payload = {
            chapter: GlobalGameState.chapter,
            gameCleared: GlobalGameState.gameCleared,
            cameraZoom: GlobalGameState.cameraZoom,
            currentRoom: GlobalGameState.currentRoom,
            visitedRooms: GlobalGameState.visitedRooms,
            storyFlags: GlobalGameState.storyFlags,
            quest: GlobalGameState.quest,
            inventory: GlobalGameState.inventory,
            lassoSuccessCount: GlobalGameState.lassoSuccessCount,
            berryPickCount: GlobalGameState.berryPickCount,
            shroomPickCount: GlobalGameState.shroomPickCount,
            cookSuccessCount: GlobalGameState.cookSuccessCount
          };
          localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {}
      },
      load() {
        try {
          const raw = localStorage.getItem(SAVE_STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || typeof data.chapter !== 'number') return false;
          GlobalGameState.chapter = data.chapter;
          GlobalGameState.gameCleared = !!data.gameCleared;
          if (data.cameraZoom) GlobalGameState.cameraZoom = data.cameraZoom;
          GlobalGameState.currentRoom = data.currentRoom || 'A1';
          GlobalGameState.lastFromRoom = 'DEFAULT';
          Object.assign(GlobalGameState.visitedRooms, data.visitedRooms || {});
          Object.assign(GlobalGameState.storyFlags, data.storyFlags || {});
          Object.assign(GlobalGameState.quest, data.quest || {});
          Object.assign(GlobalGameState.inventory, data.inventory || {});
          GlobalGameState.lassoSuccessCount = data.lassoSuccessCount || 0;
          GlobalGameState.berryPickCount = data.berryPickCount || 0;
          GlobalGameState.shroomPickCount = data.shroomPickCount || 0;
          GlobalGameState.cookSuccessCount = data.cookSuccessCount || 0;
          return true;
        } catch (e) {
          return false;
        }
      },
      resetAll() {
        try {
          localStorage.removeItem(SAVE_STORAGE_KEY);
        } catch (e) {}
        const fresh = createInitialState();
        Object.assign(GlobalGameState, fresh);
      }
    };

    const hasLoadedSave = SaveSystem.load();

    // ----------------------------------------------------------------------------
    // 1.3 背包与三幕式任务状态机管理器
    // ----------------------------------------------------------------------------
    const InventoryManager = {
      getTotalCount() {
        const inv = GlobalGameState.inventory;
        return inv.meat + inv.berry + inv.mushroom + inv.cookedDish;
      },
      canAdd(count = 1) {
        return this.getTotalCount() + count <= GlobalGameState.inventory.maxCapacity;
      },
      addItem(key, count = 1) {
        if (!this.canAdd(count)) return false;
        GlobalGameState.inventory[key] = (GlobalGameState.inventory[key] || 0) + count;
        QuestManager.syncWithInventory();
        SaveSystem.save();
        return true;
      },
      hasIngredientsForCurrentChapter() {
        const cfg = CHAPTER_CONFIGS[GlobalGameState.chapter];
        const inv = GlobalGameState.inventory;
        return (
          inv.meat >= cfg.recipe.meat &&
          inv.berry >= cfg.recipe.berry &&
          inv.mushroom >= cfg.recipe.mushroom
        );
      },
      completeCookingDish(quality = 'NORMAL') {
        const cfg = CHAPTER_CONFIGS[GlobalGameState.chapter];
        if (!this.hasIngredientsForCurrentChapter()) return false;
        const inv = GlobalGameState.inventory;
        inv.meat -= cfg.recipe.meat;
        inv.berry -= cfg.recipe.berry;
        inv.mushroom -= cfg.recipe.mushroom;
        inv.cookedDish = 1;
        inv.dishChapter = GlobalGameState.chapter;
        inv.dishQuality = quality;
        GlobalGameState.quest.lastCookedQuality = quality;
        GlobalGameState.cookSuccessCount += 1;
        QuestManager.setState(QUEST_STATES.DISH_COOKED);
        SaveSystem.save();
        return true;
      },
      deliverCookedDish() {
        if (GlobalGameState.inventory.cookedDish < 1) return false;
        const deliveredQuality = GlobalGameState.inventory.dishQuality;
        GlobalGameState.inventory.cookedDish = 0;
        QuestManager.setState(QUEST_STATES.DELIVERED);
        SaveSystem.save();
        return deliveredQuality;
      }
    };

    const QuestManager = {
      getCurrentConfig() {
        return CHAPTER_CONFIGS[GlobalGameState.chapter];
      },
      acceptOrder() {
        const cur = GlobalGameState.quest.state;
        if (cur === QUEST_STATES.NOT_STARTED) {
          this.setState(QUEST_STATES.ACCEPTED);
          this.syncWithInventory();
          SaveSystem.save();
        }
      },
      setState(newState) {
        GlobalGameState.quest.state = newState;
        SaveSystem.save();
      },
      advanceToChapter(nextChapter) {
        if (!CHAPTER_CONFIGS[nextChapter]) return;
        GlobalGameState.chapter = nextChapter;
        const cfg = CHAPTER_CONFIGS[nextChapter];
        GlobalGameState.quest.id = cfg.questId;
        GlobalGameState.quest.title = cfg.dishName;
        GlobalGameState.quest.state = QUEST_STATES.ACCEPTED;
        this.syncWithInventory();
        SaveSystem.save();
      },
      syncWithInventory() {
        const q = GlobalGameState.quest;
        const inv = GlobalGameState.inventory;
        if (q.state === QUEST_STATES.DELIVERED || q.state === QUEST_STATES.COMPLETED) return;
        if (inv.cookedDish >= 1 && inv.dishChapter === GlobalGameState.chapter) {
          q.state = QUEST_STATES.DISH_COOKED;
          return;
        }
        if (InventoryManager.hasIngredientsForCurrentChapter()) {
          q.state = QUEST_STATES.INGREDIENTS_READY;
        } else if (inv.meat > 0 || inv.berry > 0 || inv.mushroom > 0) {
          q.state = QUEST_STATES.IN_PROGRESS;
        } else if (q.state === QUEST_STATES.INGREDIENTS_READY) {
          q.state = QUEST_STATES.IN_PROGRESS;
        }
      }
    };

    const ROOM_METADATA = {
      A:  { name: 'A:林地',   fullName: 'A：微光林地',       width: 1500, height: 540, theme: 'forest' },
      A1: { name: 'A1:餐厅',  fullName: 'A1：暖炉餐厅与厨房', width: 1080, height: 500, theme: 'kitchen' },
      A2: { name: 'A2:牧场',  fullName: 'A2：后山呼噜兽牧场', width: 1450, height: 540, theme: 'pasture' },
      A3: { name: 'A3:树冠',  fullName: 'A3：树冠浆果林',     width: 1280, height: 680, theme: 'canopy' },
      B1: { name: 'B1:瞭望台', fullName: 'B1：林间瞭望台',     width: 1150, height: 540, theme: 'watchtower' },
      A4: { name: 'A4:洞穴',  fullName: 'A4：幽光菌菇洞穴',   width: 1350, height: 560, theme: 'cave' }
    };

    // ----------------------------------------------------------------------------
    // 2. 程序化像素美术生成引擎 (Procedural Pixel Art Factory)
    // ----------------------------------------------------------------------------
    class PixelArtFactory {
      static generateAllTextures(scene) {
        if (scene.textures.exists('player_idle')) return;

        this.createPlayerTexture(scene, 'player_idle', false);
        this.createPlayerTexture(scene, 'player_walk', true);
        this.createChefTexture(scene, 'npc_chef');
        this.createEileenTexture(scene, 'npc_eileen');
        this.createHawkTexture(scene, 'npc_hawk');
        this.createPuffBeastTexture(scene, 'creature_beast');

        this.createGrassTileTexture(scene, 'tile_ground');
        this.createCaveTileTexture(scene, 'tile_cave');
        this.createWoodFloorTexture(scene, 'tile_wood_floor');
        this.createPlatformTileTexture(scene, 'tile_platform');
        this.createBridgeTileTexture(scene, 'tile_bridge');

        this.createMushroomTexture(scene, 'bouncy_mushroom');
        this.createSignpostTexture(scene, 'signpost');
        this.createRestaurantDoorTexture(scene, 'door_wood');
        this.createKitchenStoveTexture(scene, 'kitchen_stove');
        this.createDiningTableTexture(scene, 'dining_table');

        this.createBerryBushTexture(scene, 'berry_bush_closed', false);
        this.createBerryBushTexture(scene, 'berry_bush_bloom', true);
        this.createFlowerBudTexture(scene, 'flower_bud');
        this.createLassoReticleTexture(scene, 'lasso_reticle');

        this.createNightShroomTexture(scene, 'night_shroom_normal', false);
        this.createNightShroomTexture(scene, 'night_shroom_pulse', true);

        const pGfx = scene.make.graphics({ x: 0, y: 0, add: false });
        pGfx.fillStyle(0xffe999, 1);
        pGfx.fillRect(2, 2, 4, 4);
        pGfx.fillStyle(0xffb84d, 0.45);
        pGfx.fillRect(0, 0, 8, 8);
        pGfx.generateTexture('particle_glow', 8, 8);
        pGfx.destroy();
      }

      static createPlayerTexture(scene, key, isWalkFrame) {
        const g = scene.make.graphics({ x: 0, y: 0, add: false });
        g.fillStyle(0x1f2438, 1);
        g.fillRect(8, 2, 16, 10);
        g.fillStyle(0xfbe0c4, 1);
        g.fillRect(10, 8, 13, 9);
        g.fillStyle(0x1a1c2c, 1);
        g.fillRect(19, 11, 2, 3);
        g.fillStyle(0xe86a33, 1);
        g.fillRect(8, 17, 16, 4);
        g.fillRect(6, 19, 4, 5);
        g.fillStyle(0x3b5dc9, 1);
        g.fillRect(9, 21, 14, 11);
        g.fillStyle(0xf4f4f4, 1);

    // ----------------------------------------------------------------------------
    // 3. 六房间无缝世界与三大食材玩法场景 (WorldScene)
    // ----------------------------------------------------------------------------
    class WorldScene extends Phaser.Scene {
      constructor() {
        super({ key: 'WorldScene' });
      }

      init(data) {
        this.currentRoomKey = (data && data.room) ? data.room : GlobalGameState.currentRoom;
        this.entryFrom = (data && data.from) ? data.from : GlobalGameState.lastFromRoom || 'START';
        GlobalGameState.currentRoom = this.currentRoomKey;
        GlobalGameState.lastFromRoom = this.entryFrom;
        GlobalGameState.visitedRooms[this.currentRoomKey] = true;
        SaveSystem.save();
      }

      preload() {
        PixelArtFactory.generateAllTextures(this);
      }

      create() {
        const meta = ROOM_METADATA[this.currentRoomKey];
        this.roomWidth = meta.width;
        this.roomHeight = meta.height;
        this.physics.world.setBounds(0, 0, this.roomWidth, this.roomHeight + 120);

        this.createRoomBackground(meta.theme);

        this.groundGroup = this.physics.add.staticGroup();
        this.mushroomGroup = this.physics.add.staticGroup();
        this.interactables = [];
        this.spawnMap = {};
        this.patrolNpcs = [];

        this.lassoActive = false;
        this.berryChallengeTimer = 0;
        this.berryBushes = [];
        this.caveShrooms = [];

        switch (this.currentRoomKey) {
          case 'A':  this.buildRoomA(); break;
          case 'A1': this.buildRoomA1(); break;
          case 'A2': this.buildRoomA2(); break;
          case 'A3': this.buildRoomA3(); break;
          case 'B1': this.buildRoomB1(); break;
          case 'A4': this.buildRoomA4(); break;
        }

        const spawn = this.spawnMap[this.entryFrom] || this.spawnMap['DEFAULT'] || { x: 110, y: 380 };
        this.spawnPoint = { x: spawn.x, y: spawn.y };
        this.lastSafePos = { x: spawn.x, y: spawn.y };
        this.isRespawning = false;
        this.isTransitioning = false;
        this.doorCooldown = 350;

        this.player = this.physics.add.sprite(spawn.x, spawn.y, 'player_idle');
        this.player.setSize(18, 34);
        this.player.setOffset(7, 6);
        this.player.setDepth(15);

        this.moveSpeed = 225;
        this.jumpVelocity = -445;
        this.coyoteTimeMax = 120;
        this.coyoteTimer = 0;
        this.jumpBufferMax = 120;
        this.jumpBufferTimer = 0;
        this.walkAnimTimer = 0;

        this.physics.add.collider(this.player, this.groundGroup);
        this.physics.add.collider(this.player, this.mushroomGroup, this.handleMushroomBounce, null, this);

        // 应用手机近景放大镜头 (1.25x Zoom)，让人物和文字在手机屏幕上清晰放大！
        this.cameras.main.setBounds(0, 0, this.roomWidth, this.roomHeight);
        this.cameras.main.setZoom(GlobalGameState.cameraZoom || 1.25);
        this.cameras.main.startFollow(this.player, true, 0.14, 0.14);
        this.cameras.main.fadeIn(240, 13, 17, 26);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
          left: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D,
          up: Phaser.Input.Keyboard.KeyCodes.W,
          space: Phaser.Input.Keyboard.KeyCodes.SPACE,
          interactE: Phaser.Input.Keyboard.KeyCodes.E,
          interactF: Phaser.Input.Keyboard.KeyCodes.F,
          resetR: Phaser.Input.Keyboard.KeyCodes.R,
          debugG: Phaser.Input.Keyboard.KeyCodes.G
        });

        this.promptText = this.add.text(0, 0, '', {
          fontSize: '13px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: '#1e1b18',
          backgroundColor: '#ffe89e',
          padding: { x: 6, y: 3 }
        }).setOrigin(0.5, 1).setDepth(45).setVisible(false);

        if (!this.scene.isActive('UIScene')) {
          this.scene.launch('UIScene');
        }

        QuestManager.syncWithInventory();
        this.refreshObjectiveText();

        if (this.currentRoomKey === 'A' && this.entryFrom === 'START' && GlobalGameState.roomTransitionCount === 0 && !hasLoadedSave) {
          this.time.delayedCall(300, () => {
            this.events.emit('show-dialogue', {
              speaker: '序幕：雨夜之后，异界微光（手机满屏适配版）',
              lines: [
                '冰冷的雨夜、歹徒刺眼的刀光……当你再次睁开双眼时，自己正站在异世界的【A：微光林地】中。',
                '💡【手机大屏提示】：点击右上角【⛶ 全屏】可隐藏浏览器地址栏；点击【🔍 近景】可随时切换画面放大倍数！现在向右前往【A1：暖炉餐厅】吧！'
              ]
            });
          });
        }
      }

      spawnFloatingToast(x, y, message, colorHex = '#ffe89e') {
        const toast = this.add.text(x, y - 24, message, {
          fontSize: '14px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: colorHex,
          backgroundColor: '#0f172a',
          padding: { x: 6, y: 3 }
        }).setOrigin(0.5).setDepth(60);

        this.tweens.add({
          targets: toast,
          y: y - 72,
          alpha: 0,
          duration: 1250,
          ease: 'Cubic.easeOut',
          onComplete: () => toast.destroy()
        });
      }

      addGround(startX, endX, topY, tileKey = 'tile_ground') {
        for (let x = startX; x < endX; x += 32) {
          for (let y = topY; y < this.roomHeight; y += 32) {
            const t = this.groundGroup.create(x + 16, y + 16, tileKey);
            if (y > topY) t.setTint(0x6e788f);
            t.refreshBody();
          }
        }
      }

      addPlatform(startX, widthTiles, y, tileKey = 'tile_platform') {
        for (let i = 0; i < widthTiles; i++) {
          const p = this.groundGroup.create(startX + i * 32 + 16, y + 10, tileKey);
          p.refreshBody();
        }
      }

      addWall(x, topY, bottomY) {
        for (let y = topY; y < bottomY; y += 32) {
          const w = this.groundGroup.create(x, y + 16, 'tile_ground');
          w.setTint(0x334155);
          w.refreshBody();
        }
      }

      addDoor(x, y, label, targetRoom, fromKey) {
        const door = this.add.image(x, y - 28, 'door_wood').setDepth(5);
        this.add.text(x, y - 82, `🚪 ${targetRoom}`, {
          fontSize: '12px',
          fontFamily: 'monospace',
          color: '#ffe89e',
          backgroundColor: '#1e293b',
          padding: { x: 4, y: 2 }
        }).setOrigin(0.5);

        this.interactables.push({
          id: `door_${targetRoom}_${fromKey}`,
          x: x,
          y: y,
          label: label,
          onInteract: () => this.transitionToRoom(targetRoom, fromKey)
        });
        return door;
      }

      transitionToRoom(targetRoom, fromKey) {
        if (this.isTransitioning || this.doorCooldown > 0) return;
        this.isTransitioning = true;
        SoundFX.blip();
        GlobalGameState.roomTransitionCount++;
        this.cameras.main.fadeOut(210, 13, 17, 26);
        this.time.delayedCall(220, () => {
          this.scene.restart({ room: targetRoom, from: fromKey });
        });
      }

      createRoomBackground(theme) {
        const bg = this.add.graphics();
        if (theme === 'kitchen') {
          bg.fillGradientStyle(0x2b1d16, 0x2b1d16, 0x432818, 0x58311c, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
          bg.fillStyle(0x211510, 0.65);
          for (let x = 120; x < this.roomWidth; x += 220) {
            bg.fillRect(x, 40, 24, this.roomHeight - 80);
          }
        } else if (theme === 'pasture') {
          bg.fillGradientStyle(0x1b263b, 0x1b263b, 0x335c67, 0x2d6a4f, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
        } else if (theme === 'canopy') {
          bg.fillGradientStyle(0x081c15, 0x081c15, 0x1b4332, 0x2d6a4f, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
        } else if (theme === 'watchtower') {
          bg.fillGradientStyle(0x0f172a, 0x1e1b4b, 0x1e293b, 0x334155, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
        } else if (theme === 'cave') {
          bg.fillGradientStyle(0x090a14, 0x090a14, 0x1b1630, 0x1e293b, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
        } else {
          bg.fillGradientStyle(0x0f172a, 0x0f172a, 0x1e293b, 0x26354d, 1);
          bg.fillRect(0, 0, this.roomWidth, this.roomHeight);
        }
        bg.setScrollFactor(0);

        for (let i = 0; i < 18; i++) {
          const px = Phaser.Math.Between(40, this.roomWidth - 40);
          const py = Phaser.Math.Between(60, this.roomHeight - 80);
          const p = this.add.image(px, py, 'particle_glow').setAlpha(0.45);
          this.tweens.add({
            targets: p,
            y: py - 18,
            alpha: 0.15,
            duration: Phaser.Math.Between(1500, 2600),
            yoyo: true,
            repeat: -1
          });
        }
      }

      // ========================================================================
      // 房间 A：微光林地
      // ========================================================================
      buildRoomA() {
        this.spawnMap = {
          START:   { x: 110,  y: 380 },
          DEFAULT: { x: 110,  y: 380 },
          from_A1: { x: 1320, y: 360 }
        };

        this.addWall(16, 80, 444);
        this.addGround(0, 480, 444);
        this.addPlatform(520, 3, 368);
        this.addPlatform(664, 3, 304);
        this.addGround(800, 1088, 444);

        const m = this.mushroomGroup.create(1000, 428, 'bouncy_mushroom');
        m.refreshBody();

        this.addPlatform(1060, 4, 260);
        this.addGround(1216, 1500, 412);
        this.addWall(1484, 80, 412);

      startLassoMode() {
        SoundFX.blip();
        this.lassoActive = true;
        this.lassoReticle.x = 410;
        this.lassoReticle.y = 418;
        this.lassoReticleDir = 1;
        this.lassoReticle.setVisible(true);
        this.lassoBanner.setVisible(true);
        this.player.setVelocityX(0);
      }

      stopLassoMode() {
        this.lassoActive = false;
        if (this.lassoReticle) this.lassoReticle.setVisible(false);
        if (this.lassoBanner) this.lassoBanner.setVisible(false);
        if (this.lassoRopeGfx) this.lassoRopeGfx.clear();
      }

      throwLassoAtReticle() {
        if (!this.lassoActive) return;

        const rx = this.lassoReticle.x;
        let hitBeast = null;
        for (const b of this.patrolNpcs) {
          const hitRadius = b.state === 'YAWN' ? 54 : 42;
          if (Math.abs(b.sprite.x - rx) <= hitRadius) {
            hitBeast = b;
            break;
          }
        }

        if (hitBeast) {
          const added = InventoryManager.addItem('meat', 1);
          this.stopLassoMode();
          if (added) {
            SoundFX.pickup();
            GlobalGameState.lassoSuccessCount++;
            this.refreshObjectiveText();
            this.cameras.main.shake(110, 0.004);
            this.events.emit('inventory-updated');
            const bonusMsg = hitBeast.state === 'YAWN' ? '🎯 完美破绽命中！+1 鲜嫩兽肉 🥩' : '🪢 套索命中！+1 鲜嫩兽肉 🥩';
            this.spawnFloatingToast(hitBeast.sprite.x, hitBeast.sprite.y, bonusMsg, '#8ae0a8');

            this.tweens.add({
              targets: hitBeast.sprite,
              y: hitBeast.sprite.y - 22,
              duration: 130,
              yoyo: true
            });
          } else {
            SoundFX.fail();
            this.spawnFloatingToast(this.player.x, this.player.y, '⚠️ 背包已满 (8/8)！', '#ff6b6b');
          }
        } else {
          SoundFX.fail();
          this.cameras.main.shake(70, 0.003);
          this.spawnFloatingToast(rx, 395, '💨 套空了！看准呼噜兽再抛一次', '#ffb84d');
        }
      }

        QuestManager.syncWithInventory();
        const ch = GlobalGameState.chapter;
        const cfg = CHAPTER_CONFIGS[ch];
        const qState = GlobalGameState.quest.state;
        const inv = GlobalGameState.inventory;

        if (GlobalGameState.gameCleared) {
          GlobalGameState.currentObjective = '🏆 全剧情通关！可自由探索或重做团圆宴';
          return;
        }

        if (qState === QUEST_STATES.DISH_COOKED) {
          GlobalGameState.currentObjective = `[第${ch}章]《${cfg.dishName}》已出锅 -> 送给 ${cfg.customerName}`;
        } else if (qState === QUEST_STATES.INGREDIENTS_READY) {
          GlobalGameState.currentObjective = `[第${ch}章] 材料齐备 -> 回 A1 灶台做《${cfg.dishName}》`;
        } else {
          if (ch === 1) {
            GlobalGameState.currentObjective = `[第1章·艾琳] 收集 🥩(${inv.meat}/1)+🍒(${inv.berry}/1) 做《蜜林浆果烤肉》`;
          } else if (ch === 2) {
            GlobalGameState.currentObjective = `[第2章·老霍克] 收集 🥩(${inv.meat}/1)+A4夜光菇🍄(${inv.mushroom}/1)`;
          } else {
            GlobalGameState.currentObjective = `[终章·团圆宴] 收集 🥩(${inv.meat}/1)+🍒(${inv.berry}/1)+🍄(${inv.mushroom}/1)`;
          }
        }
      }

      handleMushroomBounce(player, mushroom) {
        if (player.body.touching.down && mushroom.body.touching.up) {
          SoundFX.bounce();
          player.setVelocityY(-640);
          GlobalGameState.mushroomBounceCount++;
          this.tweens.add({
            targets: mushroom,
            scaleY: 0.65,
            scaleX: 1.25,
            duration: 90,
            yoyo: true,
            ease: 'Quad.easeOut'
          });
        }
      }

      triggerSafeRespawn() {
        if (this.isRespawning) return;
        this.isRespawning = true;
        SoundFX.fail();
        GlobalGameState.respawnCount++;

        this.player.setVelocity(0, 0);
        this.player.body.enable = false;
        this.cameras.main.flash(220, 255, 232, 158);
        this.time.delayedCall(180, () => {
          this.player.setPosition(this.lastSafePos.x, this.lastSafePos.y - 10);
          this.player.body.enable = true;
          this.isRespawning = false;
        });
      }

      update(time, delta) {
        if (this.isRespawning || this.isTransitioning) return;

        if (this.doorCooldown > 0) {
          this.doorCooldown = Math.max(0, this.doorCooldown - delta);
        }

        for (const npc of this.patrolNpcs) {
          npc.stateTimer -= delta;
          if (npc.stateTimer <= 0) {
            const roll = Phaser.Math.Between(1, 100);
            if (roll <= 40) {
              npc.state = 'YAWN';
              npc.stateTimer = 2200;
              npc.stateTag.setText('✨打哈欠(快套!)');
              npc.stateTag.setColor('#ffe89e');
            } else if (roll <= 75) {
              npc.state = 'WALK';
              npc.stateTimer = 2600;
              npc.stateTag.setText('散步中');
              npc.stateTag.setColor('#cbd5e1');
            } else {
              npc.state = 'RUN';
              npc.stateTimer = 1600;
              npc.stateTag.setText('💨小跑中');
              npc.stateTag.setColor('#94a3b8');
            }
          }

          const mult = npc.state === 'YAWN' ? 0 : (npc.state === 'RUN' ? 1.65 : 1);
          npc.sprite.x += npc.baseSpeed * mult * npc.dir * (delta / 1000);
          if (npc.sprite.x > npc.maxX) {
            npc.dir = -1;
            npc.sprite.setFlipX(true);
          } else if (npc.sprite.x < npc.minX) {
            npc.dir = 1;
            npc.sprite.setFlipX(false);
          }
          npc.stateTag.setPosition(npc.sprite.x, npc.sprite.y - 34);
        }

        if (this.lassoActive && this.lassoReticle) {
          this.lassoReticle.x += this.lassoReticleSpeed * this.lassoReticleDir * (delta / 1000);
          if (this.lassoReticle.x > 840) {
            this.lassoReticle.x = 840;
            this.lassoReticleDir = -1;
          } else if (this.lassoReticle.x < 390) {
            this.lassoReticle.x = 390;
            this.lassoReticleDir = 1;
          }
          this.lassoReticle.angle += 2.5;

          this.lassoRopeGfx.clear();
          this.lassoRopeGfx.lineStyle(2, 0xffb84d, 0.85);
          this.lassoRopeGfx.lineBetween(this.player.x, this.player.y - 8, this.lassoReticle.x, this.lassoReticle.y);
        }

        if (this.currentRoomKey === 'A3' && this.berryChallengeTimer > 0) {
          this.berryChallengeTimer = Math.max(0, this.berryChallengeTimer - delta);
          const sec = (this.berryChallengeTimer / 1000).toFixed(1);
          this.budStatusText.setText(`⏳ 浆果绽放倒计时: ${sec}s`);
          this.budStatusText.setColor('#8ae0a8');

          for (const b of this.berryBushes) {
            if (!b.harvested) {
              const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, b.x, b.y);
              if (dist < 46) {
                if (InventoryManager.canAdd(1)) {
                  b.harvested = true;
                  b.sprite.setAlpha(0.35);
                  b.tag.setText('✅ 已摘取');
                  b.tag.setColor('#8ae0a8');
                  InventoryManager.addItem('berry', 1);
                  SoundFX.pickup();
                  GlobalGameState.berryPickCount++;
                  this.refreshObjectiveText();
                  this.events.emit('inventory-updated');
                  this.spawnFloatingToast(b.x, b.y, '+1 晨露浆果 🍒', '#ffccd5');
                } else {
                  this.spawnFloatingToast(b.x, b.y, '⚠️ 背包已满 (8/8)！', '#ff6b6b');
                }
              }
            }
          }

          if (this.berryChallengeTimer === 0) {
            this.budStatusText.setText('🔔 风铃花苞 (按互动重新唤醒浆果)');
            this.budStatusText.setColor('#ffe89e');
            for (const b of this.berryBushes) {
              b.harvested = false;
              b.sprite.setTexture('berry_bush_closed');
              b.sprite.setAlpha(1);
              b.tag.setText('🔒 未绽放');
              b.tag.setColor('#94a3b8');
            }
          }
        }

        if (this.currentRoomKey === 'A4') {
          for (const shroom of this.caveShrooms) {
            if (shroom.cooldown > 0) {
              shroom.cooldown = Math.max(0, shroom.cooldown - delta);
              shroom.isGoldenWindow = false;
              shroom.sprite.setAlpha(0.35);
              shroom.sprite.setTexture('night_shroom_normal');
              shroom.tag.setText(`⏳ 生长中 ${(shroom.cooldown / 1000).toFixed(1)}s`);
              shroom.tag.setColor('#64748b');
            } else {
              shroom.sprite.setAlpha(1);
              const cyclePos = (time + shroom.phaseOffset) % 3200;
              if (cyclePos < 1400) {
                shroom.isGoldenWindow = true;
                shroom.sprite.setTexture('night_shroom_pulse');
                shroom.tag.setText('✨松动期(按互动拔!)');
                shroom.tag.setColor('#ffe89e');
              } else {
                shroom.isGoldenWindow = false;
                shroom.sprite.setTexture('night_shroom_normal');
                shroom.tag.setText('🔒 泥土紧绷(勿拔)');
                shroom.tag.setColor('#94a3b8');
              }
            }
          }
        }

        const uiScene = this.scene.get('UIScene');
        const isModalBusy = uiScene && (uiScene.isDialogueActive || uiScene.isCookingActive || uiScene.isEndingActive);

        if (Phaser.Input.Keyboard.JustDown(this.keys.debugG)) {
          GlobalGameState.debugVisible = !GlobalGameState.debugVisible;
        }

        if (Phaser.Input.Keyboard.JustDown(this.keys.resetR) && !isModalBusy) {
          this.stopLassoMode();
          this.player.setPosition(this.spawnPoint.x, this.spawnPoint.y);
          this.player.setVelocity(0, 0);
        }

        const vInput = GlobalGameState.virtualInput;
        const onGround = this.player.body.blocked.down;

        if (onGround && this.player.x > 48 && this.player.x < this.roomWidth - 48) {
          this.lastSafePos.x = Math.round(this.player.x);
          this.lastSafePos.y = Math.round(this.player.y);
        }

        if (onGround) {
          this.coyoteTimer = this.coyoteTimeMax;
        } else {
          this.coyoteTimer = Math.max(0, this.coyoteTimer - delta);
        }

        const keyJumpJustDown =
          Phaser.Input.Keyboard.JustDown(this.cursors.up) ||
          Phaser.Input.Keyboard.JustDown(this.keys.up) ||
          Phaser.Input.Keyboard.JustDown(this.keys.space) ||
          vInput.jumpJustDown;

        vInput.jumpJustDown = false;

        if (keyJumpJustDown && !isModalBusy) {
          if (this.lassoActive) this.stopLassoMode();
          this.jumpBufferTimer = this.jumpBufferMax;
        } else {
          this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - delta);
        }

        const moveLeft = !isModalBusy && (this.cursors.left.isDown || this.keys.left.isDown || vInput.left);
        const moveRight = !isModalBusy && (this.cursors.right.isDown || this.keys.right.isDown || vInput.right);

        if (moveLeft || moveRight) {
          if (this.lassoActive) this.stopLassoMode();
        }

        if (moveLeft) {
          this.player.setVelocityX(-this.moveSpeed);
          this.player.setFlipX(true);
        } else if (moveRight) {
          this.player.setVelocityX(this.moveSpeed);
          this.player.setFlipX(false);
        } else {
          this.player.setVelocityX(0);
        }

        if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0 && !isModalBusy) {
          SoundFX.jump();
          this.player.setVelocityY(this.jumpVelocity);
          this.jumpBufferTimer = 0;
          this.coyoteTimer = 0;
        }

        const isHoldingJump =
          this.cursors.up.isDown ||
          this.keys.up.isDown ||
          this.keys.space.isDown ||
          vInput.jumpPressed;

        if (!isHoldingJump && this.player.body.velocity.y < -180) {
          this.player.setVelocityY(this.player.body.velocity.y * 0.65);
        }

        if (onGround && Math.abs(this.player.body.velocity.x) > 10) {
          this.walkAnimTimer += delta;
          if (this.walkAnimTimer > 140) {
            this.walkAnimTimer = 0;
            const nextKey = this.player.texture.key === 'player_idle' ? 'player_walk' : 'player_idle';
            this.player.setTexture(nextKey);
          }
        } else {
          this.player.setTexture(onGround ? 'player_idle' : 'player_walk');
        }

        if (this.player.y > this.roomHeight + 30) {
          this.triggerSafeRespawn();
        }

        const interactTriggered =
          Phaser.Input.Keyboard.JustDown(this.keys.interactE) ||
          Phaser.Input.Keyboard.JustDown(this.keys.interactF) ||
          vInput.interactJustDown;

        if (this.lassoActive && !isModalBusy) {
          this.promptText.setText('🎯 [★互动] 立即抛出套索！');
          this.promptText.setPosition(this.player.x, this.player.y - 46);
          this.promptText.setVisible(true);
          if (interactTriggered) {
            vInput.interactJustDown = false;
            this.throwLassoAtReticle();
          }
        } else {
          let closestItem = null;
          let minDist = 68;
          for (const item of this.interactables) {
            const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, item.x, item.y);
            if (dist < minDist) {
              minDist = dist;
              closestItem = item;
            }
          }

          if (closestItem && !isModalBusy) {
            this.promptText.setText(`[★互动] ${closestItem.label}`);
            this.promptText.setPosition(closestItem.x, closestItem.y - 52);
            this.promptText.setVisible(true);

            if (interactTriggered) {
              vInput.interactJustDown = false;
              closestItem.onInteract();
            }
          } else {
            this.promptText.setVisible(false);
            if (!isModalBusy) {
              vInput.interactJustDown = false;
            }
          }

          GlobalGameState.telemetry.nearTarget = closestItem ? closestItem.label : '无';
        }

        GlobalGameState.telemetry.x = Math.round(this.player.x);
        GlobalGameState.telemetry.y = Math.round(this.player.y);
        GlobalGameState.telemetry.vx = Math.round(this.player.body.velocity.x);
        GlobalGameState.telemetry.vy = Math.round(this.player.body.velocity.y);
        GlobalGameState.telemetry.grounded = onGround;
        GlobalGameState.telemetry.coyoteTimer = Math.round(this.coyoteTimer);
        GlobalGameState.telemetry.safeX = this.lastSafePos.x;
        GlobalGameState.telemetry.safeY = this.lastSafePos.y;
      }
    }

    // ----------------------------------------------------------------------------
    // 4. 手机超宽屏自适应 UI 场景 (UIScene)
    // ----------------------------------------------------------------------------
    class UIScene extends Phaser.Scene {
      constructor() {
        super({ key: 'UIScene' });
      }

      create() {
        this.input.addPointer(3);
        const W = this.scale.width;
        const H = this.scale.height;
        const centerX = Math.round(W / 2);

        this.isDialogueActive = false;
        this.dialogueLines = [];
        this.dialogueIndex = 0;

        this.isCookingActive = false;
        this.activeChapterCfg = CHAPTER_CONFIGS[1];
        this.cookingHeat = 30;
        this.cookingProgress = 0;
        this.cookingMistakeTime = 0;
        this.isStokingFire = false;
        this.cookingCallback = null;

        this.isEndingActive = false;

        // 顶部右侧 4 个紧凑工具按钮（贴齐屏幕最右侧）
        const btnH = 32;
        const btnY = 6;
        const resetW = 68;
        const debugW = 68;
        const soundW = 68;
        const zoomW  = 74;
        const fullW  = 72;
        const gap = 5;

        let rightCursor = W - 8;

        // 按钮 5：重置存档
        rightCursor -= resetW;
        this.createTopButton(rightCursor, btnY, resetW, btnH, '🗑重置', () => {
          if (this.isCookingActive) return;
          SaveSystem.resetAll();
          this.isEndingActive = false;
          if (this.endingContainer) this.endingContainer.setVisible(false);
          const world = this.scene.get('WorldScene');
          if (world) world.scene.restart({ room: 'A', from: 'START' });
        });

        // 按钮 4：遥测开关
        rightCursor -= (debugW + gap);
        this.createTopButton(rightCursor, btnY, debugW, btnH, '🛠遥测', () => {
          GlobalGameState.debugVisible = !GlobalGameState.debugVisible;
        });

        // 按钮 3：音效开关
        rightCursor -= (soundW + gap);
        this.soundBtnText = this.createTopButton(rightCursor, btnY, soundW, btnH, '🔊音效', () => {
          SoundFX.muted = !SoundFX.muted;
          this.soundBtnText.setText(SoundFX.muted ? '🔇静音' : '🔊音效');
          if (!SoundFX.muted) SoundFX.blip();
        });

        // 按钮 2：镜头远近切换（1.25x 近景放大 vs 1.0x 标准全景）
        rightCursor -= (zoomW + gap);
        const initZoomLabel = GlobalGameState.cameraZoom > 1.1 ? '🔍近景' : '🔍标准';
        this.zoomBtnText = this.createTopButton(rightCursor, btnY, zoomW, btnH, initZoomLabel, () => {
          GlobalGameState.cameraZoom = GlobalGameState.cameraZoom > 1.1 ? 1.0 : 1.28;
          this.zoomBtnText.setText(GlobalGameState.cameraZoom > 1.1 ? '🔍近景' : '🔍标准');
          const world = this.scene.get('WorldScene');
          if (world && world.cameras && world.cameras.main) {
            world.cameras.main.zoomTo(GlobalGameState.cameraZoom, 220, 'Sine.easeInOut');
          }
          SaveSystem.save();
        });

        // 按钮 1：一键全屏（隐藏手机浏览器地址栏）
        rightCursor -= (fullW + gap);
        this.createTopButton(rightCursor, btnY, fullW, btnH, '⛶全屏', () => {
          toggleBrowserFullscreen();
        }, 0x2b6cb0);

        // 顶部左侧：自适应宽度的黄色目标栏（绝不与右侧按钮重叠，且内部自动裁剪保护）
        const objBoxX = 8;
        const objBoxW = Math.max(260, rightCursor - objBoxX - 8);
        this.objMaxWidth = objBoxW - 16;

        const topBar = this.add.graphics();
        topBar.fillStyle(0x0f172a, 0.92);
        topBar.fillRect(objBoxX, btnY, objBoxW, btnH);
        topBar.lineStyle(2, 0xffb84d, 0.95);
        topBar.strokeRect(objBoxX, btnY, objBoxW, btnH);

        this.objectiveText = this.add.text(objBoxX + 8, btnY + 8, '', {
          fontSize: '13px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: '#ffe89e'
        });

        // 右上角全食材背包栏（贴合屏幕右侧）
        const invW = 290;
        const invX = W - invW / 2 - 8;
        this.invBox = this.add.rectangle(invX, 58, invW, 30, 0x131824, 0.92)
          .setStrokeStyle(2, 0x52b788, 0.95);
        this.invText = this.add.text(invX, 58, '', {
          fontSize: '12px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: '#f8fafc'
        }).setOrigin(0.5);

        // 左上角可折叠遥测面板
        this.debugBg = this.add.graphics();
        this.debugBg.fillStyle(0x090d16, 0.85);
        this.debugBg.fillRect(8, 44, 355, 136);
        this.debugBg.lineStyle(1, 0x41a67e, 0.85);
        this.debugBg.strokeRect(8, 44, 355, 136);

        this.debugText = this.add.text(16, 50, '', {
          fontSize: '11px',
          fontFamily: 'monospace',
          color: '#8ae0a8',
          lineSpacing: 3
        });

        this.createTouchControls(W, H);
        this.createDialogueBox(centerX, H);
        this.createCookingMinigameModal(centerX, H);
        this.createEndingCutsceneModal(W, H, centerX);

        const worldScene = this.scene.get('WorldScene');
        worldScene.events.on('show-dialogue', (data) => {
          this.openDialogue(data.speaker, data.lines);
        });
        worldScene.events.on('inventory-updated', () => {
          this.tweens.add({
            targets: [this.invBox, this.invText],
            scaleX: 1.07,
            scaleY: 1.12,
            duration: 110,
            yoyo: true
          });
        });
        worldScene.events.on('start-cooking-minigame', (cfg) => {
          this.openCookingMinigame(cfg);
        });
        worldScene.events.on('show-ending-modal', (data) => {
          this.openEndingModal(data.quality);
        });

        this.cookKeys = this.input.keyboard.addKeys({
          space: Phaser.Input.Keyboard.KeyCodes.SPACE,
          e: Phaser.Input.Keyboard.KeyCodes.E,
          w: Phaser.Input.Keyboard.KeyCodes.W,
          up: Phaser.Input.Keyboard.KeyCodes.UP
        });

        this.input.keyboard.on('keydown-SPACE', () => {
          if (this.isDialogueActive) this.advanceDialogue();
        });
        this.input.keyboard.on('keydown-E', () => {
          if (this.isDialogueActive) this.advanceDialogue();
        });
        this.input.keyboard.on('keydown-ENTER', () => {
          if (this.isDialogueActive) this.advanceDialogue();
        });
      }

        const cy = Math.round(H / 2);

        const panelBg = this.add.rectangle(centerX, cy, 480, 265, 0x131824, 0.96)

        this.barWidth = 370;

      openEndingModal(quality) {

        const qualityLine = quality === 'PERFECT'
          ? '【★主厨级·异界团圆什锦炙烤】散发着金色的琥珀光芒，满屋飘香！'
          : '热气腾腾的【异界团圆什锦炙烤】被端上了木桌，驱散了窗外风雨的寒意！';

        const storyParagraphs = [
          qualityLine,
          '老主厨巴隆大笑着举起麦酒杯，巡林少女艾琳卸下了夜巡的紧绷露出微笑，异乡行商老霍克盛满热汤感慨万千。',
          '站在暖炉跳跃的火光旁，你低头看向自己曾经因前世遇害而发抖的双手——此刻它们稳健、温暖，充满烟火的温度。',
          '原来，转生异世界的意义不是为了挥剑杀戮，而是用一道道热菜连接孤独的灵魂。这里不再是陌生的异界，而是你的新家。'
        ].map(p => this.formatChineseWrap(p, 42)).join('\n\n');

        this.endingBody.setText(storyParagraphs);
        this.endingStats.setText(
          `📊 旅程统计：套索抓肉 ${GlobalGameState.lassoSuccessCount} 次 | 采摘浆果 ${GlobalGameState.berryPickCount} 颗 | 拔取夜光菇 ${GlobalGameState.shroomPickCount} 朵 | 成功烹饪 ${GlobalGameState.cookSuccessCount} 道`
        );
        this.endingContainer.setVisible(true);
      }

      formatChineseWrap(text, maxUnitsPerLine = 34) {
        if (!text) return '';
        const paragraphs = String(text).split('\n');
        const wrappedParagraphs = paragraphs.map(para => {
          let line = '';
          let count = 0;
          let result = '';
          for (const ch of para) {
            const charWidth = ch.charCodeAt(0) > 255 ? 1 : 0.55;
            if (count + charWidth > maxUnitsPerLine) {
              result += line + '\n';
              line = ch;
              count = charWidth;
            } else {
              line += ch;
              count += charWidth;
            }
          }
          return result + line;
        });
        return wrappedParagraphs.join('\n');
      }

      createTopButton(x, y, w, h, label, callback, customColor = 0x1e293b) {
        const bg = this.add.rectangle(x + w / 2, y + h / 2, w, h, customColor, 0.92)
          .setStrokeStyle(1.5, 0xffe89e)
          .setInteractive({ useHandCursor: true });
        const txt = this.add.text(x + w / 2, y + h / 2, label, {
          fontSize: '12px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: '#f8fafc'
        }).setOrigin(0.5);

        bg.on('pointerdown', () => {
          bg.setFillStyle(0x3b5dc9, 0.98);
          callback();
        });
        bg.on('pointerup', () => bg.setFillStyle(customColor, 0.92));
        bg.on('pointerout', () => bg.setFillStyle(customColor, 0.92));
        return txt;
      }

      // 放大 30% 并贴齐手机屏幕最左/最右下角的触控按钮
      createTouchControls(W, H) {
        const vInput = GlobalGameState.virtualInput;
        const btnW = 94;
        const btnH = 72;
        const padY = H - btnH / 2 - 10;

        const makePadBtn = (x, y, w, h, label, colorHex, onDown, onUp) => {
          const btn = this.add.rectangle(x, y, w, h, colorHex, 0.55)
            .setStrokeStyle(2.5, 0xffe89e, 0.85)
            .setInteractive();
          const txt = this.add.text(x, y, label, {
            fontSize: '20px',
            fontFamily: 'monospace',
            fontStyle: 'bold',
            color: '#ffffff'
          }).setOrigin(0.5).setAlpha(0.95);

          btn.on('pointerdown', () => {
            btn.setAlpha(0.92);
            onDown();
          });
          btn.on('pointerup', () => {
            btn.setAlpha(0.55);
            onUp();
          });
          btn.on('pointerout', () => {
            btn.setAlpha(0.55);
            onUp();
          });
          return { btn, txt };
        };

        // 左下角方向键（紧贴屏幕最左侧人体工学拇指区）
        makePadBtn(14 + btnW / 2, padY, btnW, btnH, '◀ 左', 0x1e293b,
          () => { vInput.left = true; },
          () => { vInput.left = false; }
        );
        makePadBtn(14 + btnW + 12 + btnW / 2, padY, btnW, btnH, '右 ▶', 0x1e293b,
          () => { vInput.right = true; },
          () => { vInput.right = false; }
        );

        // 右下角动作键（紧贴屏幕最右侧人体工学拇指区）
        makePadBtn(W - 14 - btnW - 12 - btnW / 2, padY, btnW, btnH, '★互动', 0xb84a39,
          () => {
            if (this.isCookingActive) {
              this.isStokingFire = true;
            } else if (this.isDialogueActive) {
              this.advanceDialogue();
            } else {
              vInput.interactJustDown = true;
            }
          },
          () => {
            if (this.isCookingActive) {
              this.isStokingFire = false;
            }
          }
        );
        makePadBtn(W - 14 - btnW / 2, padY, btnW, btnH, '▲跳跃', 0x2b6cb0,
          () => {
            if (this.isCookingActive) {
              this.isStokingFire = true;
            } else {
              vInput.jumpPressed = true;
              vInput.jumpJustDown = true;
            }
          },
          () => {
            this.isStokingFire = false;
            vInput.jumpPressed = false;
          }
        );
      }

      createDialogueBox(centerX, H) {
        this.dialogueContainer = this.add.container(0, 0).setDepth(100).setVisible(false);
        const boxW = 560;
        const boxH = 136;
        const boxY = H - boxH / 2 - 14;
        const leftEdge = centerX - boxW / 2 + 18;

        const boxBg = this.add.rectangle(centerX, boxY, boxW, boxH, 0x131824, 0.96)
          .setStrokeStyle(3, 0xffb84d, 1)
          .setInteractive();

        this.speakerTag = this.add.text(leftEdge, boxY - boxH / 2 + 8, '', {
          fontSize: '14px',
          fontFamily: 'monospace',
          fontStyle: 'bold',
          color: '#131824',
          backgroundColor: '#ffb84d',
          padding: { x: 8, y: 3 }
        });

        this.dialogueBody = this.add.text(leftEdge, boxY - boxH / 2 + 36, '', {
          fontSize: '14px',
          fontFamily: 'monospace',
          color: '#f8fafc',
          lineSpacing: 6
        });

        this.dialogueHint = this.add.text(centerX + boxW / 2 - 16, boxY + boxH / 2 - 10, '点击继续 ▶', {
          fontSize: '12px',
          fontFamily: 'monospace',
          color: '#ffe89e'
        }).setOrigin(1, 1);

        boxBg.on('pointerdown', () => this.advanceDialogue());

        this.dialogueContainer.add([boxBg, this.speakerTag, this.dialogueBody, this.dialogueHint]);
      }

      openDialogue(speaker, lines) {
        SoundFX.blip();
        this.isDialogueActive = true;
        this.dialogueLines = lines;
        this.dialogueIndex = 0;
        this.speakerTag.setText(speaker);
        this.dialogueBody.setText(this.formatChineseWrap(this.dialogueLines[0], 34));
        this.dialogueContainer.setVisible(true);
      }

      advanceDialogue() {
        SoundFX.blip();
        this.dialogueIndex++;
        if (this.dialogueIndex < this.dialogueLines.length) {
          this.dialogueBody.setText(this.formatChineseWrap(this.dialogueLines[this.dialogueIndex], 34));
        } else {
          this.isDialogueActive = false;
          this.dialogueContainer.setVisible(false);
        }
      }

      update(time, delta) {
        const dt = delta / 1000;
        const roomMeta = ROOM_METADATA[GlobalGameState.currentRoom];
        const roomShort = roomMeta ? roomMeta.name : GlobalGameState.currentRoom;
        const fullObjStr = `[${roomShort}] ${GlobalGameState.currentObjective}`;
        this.objectiveText.setText(fullObjStr);

        // 防止顶部目标栏文字超出黄色框右侧
        if (this.objectiveText.width > this.objMaxWidth) {
          let clipped = fullObjStr;
          while (clipped.length > 6 && this.objectiveText.width > this.objMaxWidth) {
            clipped = clipped.slice(0, -2);
            this.objectiveText.setText(clipped + '…');
          }
        }

        const inv = GlobalGameState.inventory;
        const total = InventoryManager.getTotalCount();
        const curCfg = CHAPTER_CONFIGS[GlobalGameState.chapter];
        const dishIcon = (inv.dishQuality === 'PERFECT' && inv.cookedDish > 0) ? `★${curCfg.dishIcon}` : curCfg.dishIcon;
        this.invText.setText(`🎒${total}/${inv.maxCapacity} | 🥩×${inv.meat} 🍒×${inv.berry} 🍄×${inv.mushroom} ${dishIcon}×${inv.cookedDish}`);

        if (this.isCookingActive) {
          const keyHolding =
            this.cookKeys.space.isDown ||
            this.cookKeys.e.isDown ||
            this.cookKeys.w.isDown ||
            this.cookKeys.up.isDown ||
            this.isStokingFire;

          if (keyHolding) {
            this.cookingHeat = Math.min(100, this.cookingHeat + 58 * dt);
          } else {
            this.cookingHeat = Math.max(0, this.cookingHeat - 40 * dt);
          }

          const phases = this.activeChapterCfg.phases;
          let activePhase = phases[phases.length - 1];
          for (const ph of phases) {
            if (this.cookingProgress >= ph.minProg && this.cookingProgress < ph.maxProg) {
              activePhase = ph;
              break;
            }
          }

          const targetMin = activePhase.minHeat;
          const targetMax = activePhase.maxHeat;
          this.cookPhaseText.setText(activePhase.label);
          this.cookPhaseText.setColor(activePhase.color);

          const zoneCenterRatio = (targetMin + targetMax) / 200;
          const zoneWidthRatio = (targetMax - targetMin) / 100;
          this.targetZoneRect.x = this.barLeftX + this.barWidth * zoneCenterRatio;
          this.targetZoneRect.width = this.barWidth * zoneWidthRatio;

          this.heatPointer.x = this.barLeftX + (this.cookingHeat / 100) * this.barWidth;

          if (this.cookingHeat >= targetMin && this.cookingHeat <= targetMax) {
            this.cookingProgress = Math.min(100, this.cookingProgress + 23 * dt);
            this.heatStatusText.setText('✨ 完美火候！香味正在迅速凝聚...');
            this.heatStatusText.setColor('#8ae0a8');
          } else {
            this.cookingProgress = Math.min(100, this.cookingProgress + 4.5 * dt);
            this.cookingMistakeTime += dt;
            if (this.cookingHeat > targetMax) {
              this.heatStatusText.setText('⚠️ 火候过高！松开鼓风降温，小心烤焦！');
              this.heatStatusText.setColor('#ff6b6b');
            } else {
              this.heatStatusText.setText('❄️ 火力不足！按住【🔥鼓风升温】或右下按键！');
              this.heatStatusText.setColor('#93c5fd');
            }
          }

          this.progFill.width = Math.max(4, (this.cookingProgress / 100) * (this.barWidth - 4));
          const qualityPreview = this.cookingMistakeTime <= 3.5 ? '★主厨级美味预备' : '普通品质预备';
          this.progLabel.setText(`烹饪进度: ${Math.floor(this.cookingProgress)}% (${qualityPreview})`);

          if (this.cookingProgress >= 100) {
            this.isCookingActive = false;
            this.isStokingFire = false;
            this.cookingContainer.setVisible(false);
            const finalQuality = this.cookingMistakeTime <= 3.5 ? 'PERFECT' : 'NORMAL';
            if (this.cookingCallback) {
              this.cookingCallback(finalQuality);
            }
          }
        }

        this.debugBg.setVisible(GlobalGameState.debugVisible);
        this.debugText.setVisible(GlobalGameState.debugVisible);

        if (GlobalGameState.debugVisible) {
          const t = GlobalGameState.telemetry;
          const qState = GlobalGameState.quest.state;
          const flags = GlobalGameState.storyFlags;
          this.debugText.setText([
            `[阶段5 手机满屏适配版 · 遥测面板]`,
            `视口尺寸 : ${this.scale.width}×${this.scale.height} | 镜头放大: ${GlobalGameState.cameraZoom}x`,
            `当前章节 : 第 ${GlobalGameState.chapter}/3 章《${CHAPTER_CONFIGS[GlobalGameState.chapter].dishName}》`,
            `任务状态 : ${qState} (${QUEST_STATE_LABELS[qState]})`,
            `食客入驻 : 艾琳:${flags.eileenInRestaurant ? '✅' : '否'} | 老霍克:${flags.hawkInRestaurant ? '✅' : '否'} | 矿梯:${flags.mineLiftUnlocked ? '✅' : '否'}`,
            `附近交互 : ${t.nearTarget}`
          ]);
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 5. 启动 Phaser 3 游戏实例（动态匹配手机超宽屏比例）
    // ----------------------------------------------------------------------------
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: VIEWPORT.width,
      height: VIEWPORT.height,
      backgroundColor: '#0d111a',
      pixelArt: true,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 1100 },
          debug: false
        }
      },
      scene: [WorldScene, UIScene]
    };

    window.addEventListener('load', () => {
      new Phaser.Game(config);
    });
  </script>
</body>
